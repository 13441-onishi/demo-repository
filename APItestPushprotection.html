<!DOCTYPE html>
<html>
<head>
    <title>Nearby Ramen Shops</title>
    <style>
        #map {
            height: 300px;
            width: 40%;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        #details {
            margin-top: 10px;
        }
        img {
            margin: 5px;
            max-width: 100%;
            height: auto;
        }
    </style>
    <script>
        function initialize() {
            const detailsDiv = document.getElementById('details');
            detailsDiv.innerHTML = '<p>Google Maps API has been removed from this page.</p>';
        }
    </script>
</head>
<body onload="initialize()">
    <div id="map">Google Maps API has been removed</div>
    <div id="details"></div>
</body>
</html>
